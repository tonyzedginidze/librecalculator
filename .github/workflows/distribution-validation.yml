name: Distribution validation
on:
  workflow_dispatch:
  push:
    branches: ["distribution/**"]
permissions:
  contents: read
jobs:
  winget:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Update Windows Package Manager
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Microsoft.WinGet.Client)) {
            Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
          }
          Import-Module Microsoft.WinGet.Client
          Repair-WinGetPackageManager -Force -Latest
          "$env:LOCALAPPDATA\Microsoft\WindowsApps" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate WinGet manifests
        timeout-minutes: 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path distribution-evidence -Force | Out-Null
          winget --version
          winget validate --manifest distribution/winget/0.1.0 | Tee-Object distribution-evidence/winget-validate.txt
          if ($LASTEXITCODE -ne 0) { throw "Manifest validation failed." }
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw "Could not enable local manifest installation." }
      - name: Install with WinGet
        timeout-minutes: 5
        shell: pwsh
        run: |
          $install = Start-Process winget -ArgumentList 'install --manifest distribution/winget/0.1.0 --silent --verbose-logs --accept-package-agreements --accept-source-agreements --disable-interactivity' -PassThru -RedirectStandardOutput distribution-evidence/winget-install.txt -RedirectStandardError distribution-evidence/winget-error.txt
          for ($attempt = 0; $attempt -lt 12 -and -not $install.HasExited; $attempt++) {
            Start-Sleep -Seconds 10
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'Libre|setup|Edge|winget' } | Select-Object Name, ProcessId, ParentProcessId, CommandLine | ConvertTo-Json | Set-Content "distribution-evidence/processes-$attempt.json"
            Get-Content distribution-evidence/winget-install.txt
          }
          if (-not $install.HasExited) {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$pwd/distribution-evidence/install-screen.png")
            $graphics.Dispose()
            $bitmap.Dispose()
            throw "Installer did not exit within two minutes."
          }
          if ($install.ExitCode -ne 0) { throw "Manifest installation failed: $($install.ExitCode)." }
          $apps = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue
          $app = $apps | Where-Object { $_.DisplayName -eq 'Libre Calculator' } | Select-Object -First 1
          if (-not $app) { throw "Installed application was not registered." }
          $app | Select-Object DisplayName, DisplayVersion, Publisher, InstallLocation, DisplayIcon | ConvertTo-Json | Set-Content distribution-evidence/installed-app.json
          if ($app.DisplayVersion -ne '0.1.0') { throw "Installed version does not match manifest." }
          if ($app.Publisher -ne 'Libre Calculator') { throw "Installed publisher does not match manifest." }
      - name: Collect WinGet logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_*\LocalState\DiagOutputDir\*.log" -ErrorAction SilentlyContinue | Copy-Item -Destination distribution-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winget-validation
          path: distribution-evidence/
