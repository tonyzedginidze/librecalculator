name: Desktop release

# Pushing a vX.Y.Z tag (bun run release …, then git push --follow-tags) builds
# every installer and publishes them as one GitHub Release. Running it by hand
# builds the same installers as workflow artifacts without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check versions
        run: bun scripts/release.ts check ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Create draft release
        id: draft
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=false
          if [[ "$tag" == *-* ]]; then prerelease=true; fi
          # The API returns the new id directly; listing releases right after
          # creating a draft can miss it. GitHub appends generated notes to body.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$tag" -f name="Libre Calculator ${tag#v}" \
            -F body=@.github/release-notes.md \
            -F draft=true -F prerelease=$prerelease -F generate_release_notes=true \
            --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles msi,nsis
          - name: Windows arm64
            os: windows-latest
            rust_targets: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - name: Linux x64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: Linux arm64
            os: ubuntu-22.04-arm
            args: --bundles deb,rpm,appimage
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.name }}
      - run: bun install --frozen-lockfile
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # AppImage tooling runs without FUSE on hosted runners.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
      - name: Keep installers as workflow artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage

  publish:
    name: Publish
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Add checksums and publish
        run: |
          release="repos/${GITHUB_REPOSITORY}/releases/${{ needs.prepare.outputs.release_id }}"
          mkdir assets && cd assets
          # Drafts cannot be looked up by tag, so fetch the assets by id.
          gh api "$release/assets" --paginate --jq '.[] | "\(.id)\t\(.name)"' |
            while IFS=$'\t' read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/$id" > "$name"
            done
          test "$(ls | wc -l)" -gt 0
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          upload=$(gh api "$release" --jq .upload_url | sed 's/{.*//')
          gh api "$upload?name=SHA256SUMS.txt" -H "Content-Type: text/plain" --input SHA256SUMS.txt --jq .name
          gh api -X PATCH "$release" -F draft=false --jq .html_url
