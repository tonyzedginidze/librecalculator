name: Snap validation
on:
  workflow_dispatch:
  push:
    branches: ["distribution/**"]
    paths:
      - "distribution/snapcraft/**"
      - ".github/workflows/snap-validation.yml"
permissions:
  contents: read
jobs:
  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: distribution/snapcraft
      - name: Install snap and verify its entry point
        run: |
          mkdir -p distribution-evidence
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          snap list librecalculator | tee distribution-evidence/snap-list.txt
          snap connections librecalculator | tee distribution-evidence/snap-connections.txt
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils dbus-user-session imagemagick
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemd-run --user --scope --quiet --collect xvfb-run -a --auth-file="$HOME/.Xauthority" bash distribution/snapcraft/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snap-validation
          if-no-files-found: warn
          path: |
            ${{ steps.build.outputs.snap }}
            distribution-evidence/
