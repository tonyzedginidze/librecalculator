name: Snap validation
on:
  workflow_dispatch:
  push:
    branches: ["distribution/**"]
    paths:
      - "distribution/snapcraft/**"
      - ".github/workflows/snap-validation.yml"
permissions:
  contents: read
jobs:
  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: distribution/snapcraft
      - name: Install snap and verify its entry point
        run: |
          mkdir -p distribution-evidence
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          snap list librecalculator | tee distribution-evidence/snap-list.txt
          snap connections librecalculator | tee distribution-evidence/snap-connections.txt
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils dbus-x11
          dbus-run-session -- xvfb-run -a sh -c '
            snap run librecalculator > distribution-evidence/snap-launch.txt 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 30); do
              sleep 1
              if ! kill -0 "$app_pid" 2>/dev/null; then cat distribution-evidence/snap-launch.txt; exit 1; fi
              if xwininfo -root -tree | tee distribution-evidence/snap-windows.txt | grep -q "Libre Calculator"; then exit 0; fi
            done
            cat distribution-evidence/snap-launch.txt
            exit 1
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snap-validation
          if-no-files-found: warn
          path: |
            ${{ steps.build.outputs.snap }}
            distribution-evidence/
