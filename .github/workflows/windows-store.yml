name: Windows Store MSIX
on:
  workflow_dispatch:
  push:
    branches: ["store/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: bun install --frozen-lockfile
      - run: |
          bun run check:generated
          bun run check:web-topics
          bun run content-check
          bun run test
          bun run typecheck
          bun run lint
          bun run build:web
  package:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: windows-store-static
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Build desktop binary
        working-directory: apps/desktop
        run: bun run tauri build --target x86_64-pc-windows-msvc --no-bundle
      - name: Package for the Store
        shell: pwsh
        run: ./scripts/package-windows-store.ps1 -Executable apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/libre-calculator-desktop.exe
      - name: Smoke test Windows app
        shell: pwsh
        run: ./scripts/smoke-windows-store.ps1
      - name: Record build source
        shell: pwsh
        run: |
          "Source: $env:GITHUB_SHA`nRun: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content store-output/BUILD-METADATA.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: librecalculator-windows-store
          if-no-files-found: error
          path: |
            store-output/*.msix
            store-output/SHA256SUMS.txt
            store-output/BUILD-METADATA.txt
            store-output/smoke-*.png
            store-output/smoke-*.txt
