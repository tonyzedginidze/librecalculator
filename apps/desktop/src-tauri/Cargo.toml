[package]
name = "libre-calculator-desktop"
version = "0.1.0"
description = "Libre Calculator desktop application"
authors = ["Libre Calculator"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "open_calculators_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "libre-calculator-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.0"
